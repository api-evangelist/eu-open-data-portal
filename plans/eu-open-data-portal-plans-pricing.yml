description: >-
  data.europa.eu publishes no plans and no pricing, because there is nothing to sell. It is a service of the
  Publications Office of the European Union; access to every API — search, registry reads, MQA metrics, MQA
  reporting, SHACL validation, statistics and SPARQL — is free and anonymous, and the reuse of the content is
  governed by Decision 2011/833/EU on the reuse of Commission documents and the licences carried on each
  dataset, not by a subscription. Write access to a catalogue is granted administratively by the portal team
  to organisations responsible for that catalogue; it is not sold and there is no self-service sign-up.
