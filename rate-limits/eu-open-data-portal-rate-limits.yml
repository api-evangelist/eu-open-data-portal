limit_count: 0
tags: [Rate Limiting, Quotas, Throttling]
description: >-
  No rate limit is published for any data.europa.eu API, and none is signalled at runtime. Response headers
  observed on live unauthenticated calls were: server, content-type, content-length, date,
  access-control-allow-origin, strict-transport-security, x-content-type-options, x-xss-protection and the
  CloudFront cache headers (x-cache, x-amz-cf-pop, x-amz-cf-id, via). There is no X-RateLimit-*, no
  RateLimit-*, no Retry-After and no documented quota, per key, per account or per endpoint. An agent
  integrating here has no backpressure signal other than HTTP status, and no published ceiling to design
  against. The service is fronted by CloudFront, so an abusive client would most likely meet an edge
  protection response rather than a documented API limit.
