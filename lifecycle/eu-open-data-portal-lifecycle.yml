deprecation:
  policy_published: false
  policy_note: >-
    No written deprecation or sunset policy exists — no notice period, no Sunset/Deprecation headers
    (RFC 8594), no migration timetable. What the provider does publish is deprecation IN THE CONTRACT:
    33 of hub-repo's 69 operations carry `deprecated: true`, and the tag description states
    "**Deprecated !** Please use general DCAT Resources API instead", naming the replacement. That is
    machine-readable deprecation without a policy, so no `Deprecation` pointer is emitted in apis.yml.
