  source: errors/eu-open-data-portal-problem-types.yml
- id: idempotency-key
  name: Idempotency-Key request header (draft-ietf-httpapi-idempotency-key-header)
  conforms: false
  evidence: >-
    No Idempotency-Key or equivalent replay-protection header in any of the six contracts. Write safety
    comes from PUT-based upsert semantics keyed on catalogue id + originalId, not from a client-supplied key.
  source: conventions/eu-open-data-portal-conventions.yml
