domain_standard_summary:
  market: government open data / public sector information
  standards_declared_by_contract: [dcat-ap, shacl, sparql-1.1, ckan-action-api, eu-hvd]
  note: >-
    This provider is a strong domain-standard case: the contract does not merely claim DCAT-AP on a
    marketing page, it accepts and emits DCAT-AP RDF in nine serialisations, ships a public SHACL validator
