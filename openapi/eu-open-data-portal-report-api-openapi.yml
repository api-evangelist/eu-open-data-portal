openapi: 3.2.0
info:
  version: ${project.version}
  title: Metrics Reporter Report API
  x-logo:
    url: images/logo
servers:
- url: ''
tags:
- name: Report
paths:
  /report/{languageCode}:
    get:
      summary: Returns the report in the format specified by the accept header
      operationId: getReportViaHeader
      parameters:
      - name: languageCode
        in: path
        description: Language code of the report to be retrieved
        required: true
        schema:
          type: string
          enum:
          - bg
          - cs
          - da
          - de
          - el
          - en
          - es
          - et
          - fi
          - fr
          - ga
          - hr
          - hu
          - it
          - lt
          - lv
          - mt
          - nl
          - false
          - pl
          - pt
          - ro
          - sk
          - sl
          - sv
      - name: catalogueId
        in: query
        description: Catalogue ID for which to download report. Omitting yields global report.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Binary file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.spreadsheet:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request.
      tags:
      - Report
  /report/{languageCode}/{format}:
    get:
      summary: Returns the report in the specified format
      operationId: getReport
      parameters:
      - name: languageCode
        in: path
        description: Language code of the report to be retrieved
        required: true
        schema:
          type: string
          enum:
          - bg
          - cs
          - da
          - de
          - el
          - en
          - es
          - et
          - fi
          - fr
          - ga
          - hr
          - hu
          - it
          - lt
          - lv
          - mt
          - nl
          - false
          - pl
          - pt
          - ro
          - sk
          - sl
          - sv
      - name: format
        in: path
        description: Language code of the report to be retrieved
        required: true
        schema:
          type: string
          enum:
          - pdf
          - xlsx
          - ods
      - name: catalogueId
        in: query
        description: Catalogue ID for which to download report. Omitting yields global report.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Binary file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.spreadsheet:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request.
      tags:
      - Report
