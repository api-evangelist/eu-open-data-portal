components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    OrganizationId:
      name: organizationId
      description: The organization id
      in: path
      required: true
      schema:
        type: string
        pattern: '[a-z,0-9,-]+'
    CatalogueId:
      name: catalogueId
      description: The catalogue id
      in: path
      required: true
      schema:
        type: string
        pattern: '[a-z,0-9,-]+'
    ResourceId:
      name: resourceId
      description: The DCAT resource id
      in: path
      required: true
      schema:
        type: string
        pattern: '[a-z,0-9,-,~]+'
    DatasetId:
      name: datasetId
      description: The dataset id
      in: path
      required: true
      schema:
        type: string
        pattern: '[a-z,0-9,-,~]+'
    DatasetSeriesId:
      name: datasetSeriesId
      description: The dataset series id
      in: path
      required: true
      schema:
        type: string
        pattern: '[a-z,0-9,-,~]+'
    RevisionId:
      name: revisionId
      description: The dataset id
      in: path
      required: true
      schema:
        type: string
        pattern: '[a-z,0-9,-,~]+'
    VocabularyId:
      name: vocabularyId
      description: The vocabulary id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9\-~]+$
    DistributionId:
      name: distributionId
      description: The distribution id
      in: path
      required: true
      schema:
        type: string
        pattern: '[a-z,0-9,-,~]+'
    Limit:
      name: limit
      in: query
      schema:
        type: number
        format: int64
        default: 100
        minimum: 1
        maximum: 5000
    Offset:
      name: offset
      in: query
      schema:
        type: number
        format: int64
        default: 0
        minimum: 0
    UsePagedCollection:
      name: usePagedCollection
      in: query
      description: Set to 'true' to use the legacy PagedCollection format for pagination. By default,
        the response will use the updated PartialCollectionView format. This parameter is provided for
        backward compatibility with clients that expect the old format.
      schema:
        type: boolean
        default: false
    ValueType:
      name: valueType
      in: query
      description: Return value type. In case of `urifRefs` and `identifiers` Accept header will be ignored
        and the return type will always be a JSON array
      schema:
        type: string
        enum:
        - uriRefs
        - identifiers
        - originalIds
        - metadata
        default: uriRefs
  requestBodies:
    RDFBody:
      required: true
      content:
        application/rdf+xml:
          schema:
            type: string
            format: binary
        application/ld+json:
          schema:
            type: string
            format: binary
        application/n-triples:
          schema:
            type: string
            format: binary
        application/n-quads:
          schema:
            type: string
            format: binary
        application/trig:
          schema:
            type: string
            format: binary
        application/trix:
          schema:
            type: string
            format: binary
        text/turtle:
          schema:
            type: string
            format: binary
        text/n3:
          schema:
            type: string
            format: binary
  responses:
    RDFLIST200:
      description: The list of resource(s)
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
        application/rdf+xml:
          schema:
            type: string
            format: binary
        application/ld+json:
          schema:
            type: string
            format: binary
        application/n-triples:
          schema:
            type: string
            format: binary
        application/n-quads:
          schema:
            type: string
            format: binary
        application/trig:
          schema:
            type: string
            format: binary
        application/trix:
          schema:
            type: string
            format: binary
        text/turtle:
          schema:
            type: string
            format: binary
        text/n3:
          schema:
            type: string
            format: binary
    RDF200:
      description: The resource graph(s)
      content:
        application/rdf+xml:
          schema:
            type: string
            format: binary
        application/ld+json:
          schema:
            type: string
            format: binary
        application/n-triples:
          schema:
            type: string
            format: binary
        application/n-quads:
          schema:
            type: string
            format: binary
        application/trig:
          schema:
            type: string
            format: binary
        application/trix:
          schema:
            type: string
            format: binary
        text/turtle:
          schema:
            type: string
            format: binary
        text/n3:
          schema:
            type: string
            format: binary
  headers:
    LocationURIRef:
      description: The final URIRef
      schema:
        type: string
        format: uri
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
