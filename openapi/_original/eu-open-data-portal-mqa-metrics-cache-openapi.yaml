    Trigger:
      description: A trigger object.
      type: object
      required:
        - id
        - status
      properties:
        id:
          description: A unique identifier within the scope of the pipe
          type: string
        status:
          description: Indicating the status of the trigger
          type: string
          enum:
            - enabled
            - disabled
        startMode:
          description: "Behavior when the pipe is already running. Start anyway, do nothing, cancel and restart, or wait until current run has finished (previously waiting triggers will be dropped)."
          type: string
          enum:
            - drop
            - restart
            - append
            - concurrent
          default: drop
        configs:
          description: An object containing configurations to merge into specific segments
          type: object

    IntervalTrigger:
      description: Am interval based trigger
      type: object
      required:
        - interval
      allOf:
        - $ref: '#/components/schemas/Trigger'
      properties:
        interval:
          type: object
          required:
            - value
            - unit
          properties:
            value:
              type: integer
              minimum: 1
            unit:
              type: string
              enum:
                - MINUTE
                - HOUR
                - DAY
                - WEEK
                - MONTH
                - YEAR
        next:
          description: The first trigger
          type: string
          format: date-time
    CronTrigger:
      description: A cron based trigger definition
      type: object
      required:
        - cron
      allOf:
        - $ref: '#/components/schemas/Trigger'
      properties:
        cron:
          description: The cron syntax
          type: string
        next:
          description: The first trigger
          type: string
          format: date-time
    SpecificTrigger:
      description: A list of specific trigger times
      type: object
      required:
        - specific
      allOf:
        - $ref: '#/components/schemas/Trigger'
      properties:
        specific:
          description: List of specific date and time triggers
          type: array
          items:
            type: string
            format: date-time

    JSON-RPCBase:
      description: JSON-RPC Base Schema
      type: object
      required:
        - jsonrpc
      properties:
        jsonrpc:
          description: 'JSON-RPC Version `2.0`'
          type: string
          enum:
            - "2.0"
        id:
          description: Optional client side defined correlator.
          type: string
      additionalProperties: false

    JSON-RPCRequest:
      description: JSON-RPC Request
      type: object
      discriminator:
        propertyName: method
      required:
        - method
      allOf:
        - $ref: '#/components/schemas/JSON-RPCBase'
        - type: object
          properties:
            method:
              description: The method to call
              type: string
          additionalProperties: false

    refreshScope:
      description: Run Pipe Request
      type: object
      allOf:
        - $ref: '#/components/schemas/JSON-RPCBase'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              enum:
                - refreshScope
            params:
              description: Method parameters
              type: object
              required:
                - scope
              properties:
                scope:
                  description: Aggregation scope of refresh
                  type: string
                  enum:
                    - all
                    - catalogue
                catalogueId:
                  description: In case of scope 'catalogue' the catalogue id
                  type: string
              additionalProperties: false
          additionalProperties: false

    JSON-RPCError:
      description: JSON-RPC Error Response
      type: object
      required:
        - error
      allOf:
        - $ref: '#/components/schemas/JSON-RPCBase'
        - type: object
          properties:
            error:
              $ref: '#/components/schemas/JSON-RPCErrorInfo'
          additionalProperties: false

    JSON-RPCSuccess:
      description: JSON-RPC Success Response
      type: object
      required:
        - result
      allOf:
        - $ref: '#/components/schemas/JSON-RPCBase'
        - type: object
          properties:
            result:
              description: Depending of the called method, the result can look differently.
              oneOf:
                - $ref: '#/components/schemas/refreshScopeResult'
          additionalProperties: false

    JSON-RPCErrorInfo:
      description: Error Information Object
      type: object
      required:
        - code
        - message
      properties:
        code:
          description: |
            * `-1` Means "Upsala"
            * `-7` Means "That's not funny, I will not do it."
            * `-9` Means "I don't know what you mean..."
          type: integer
          enum:
            - -1
            - -7
            - -9
        message:
          type: string
        data:
          type: object
      additionalProperties: false

    refreshScopeResult:
      description: Result in case of refreshScope request
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - accepted
      additionalProperties: false

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT