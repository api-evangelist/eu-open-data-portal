        required: false
      - in: query
        name: accessLevel
        schema:
          type: string
          enum:
          - public
          - internal
          - restricted
        required: false
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/RDFBody'
      responses:
        '201':
          description: Deprecated! see `catalogue` query parameter
        '204':
          description: Dataset updated
        '304':
          description: Dataset not modified, no update necessary
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Dataset Not Found
    delete:
      deprecated: true
      description: 'This function is reserved for internal use only and is not part of our public API offerings. As an authorized user you can delete a specific dataset. Send a DELETE request to the specified URL of the API endpoint with the resource path "datasets/{datasetId}". Set the {datasetId} as the unique ID of the dataset you want to delete. This operation deletes the specified dataset, as well as all referenced distributions, from the repository and the index. It also removes any related quality measurements if they exist. Caution: you cannot revert this operation'
      summary: Delete a dataset
      operationId: deleteDataset
      tags:
      - Datasets
      parameters:
      - name: catalogue
        deprecated: true
        in: query
        description: Please, use `DELETE /catalogue/{catalogueId}/datasets/origin` instead
        schema:
          type: string
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: Dataset deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Dataset Not Found
  /datasets/revisions/{revisionId}:
    description: Deprecated!
    parameters:
    - $ref: '#/components/parameters/RevisionId'
    get:
      deprecated: true
      description: To retrieve a specific dataset revision send a GET request to the specified URL of the API endpoint with the resource path "/datasets/revisions/{revisionId}" at the end of the URL and set the unique ID of the dataset revision as {revisionId} element. This endpoint is disabled if the extended rights management feature is enabled. In this case a 405 status code is returned.
      summary: Get dataset revision
      operationId: getDatasetRevision
      tags:
      - Datasets
      responses:
        '200':
          $ref: '#/components/responses/RDF200'
        '400':
          description: Bad request
        '404':
          description: Catalogue or dataset id not found
  /datasets/{datasetId}/diff:
    description: Deprecated
    parameters:
    - $ref: '#/components/parameters/DatasetId'
    - name: revisionNumber1
      required: false
      in: query
      description: The revision number of the first revision
      schema:
        type: string
    - name: revisionNumber2
      required: false
      in: query
      description: The revision number of the second revision
      schema:
        type: string
    get:
      deprecated: true
      description: To retrieve the difference between two dataset revisions send a GET request to the specified URL of the API endpoint with the resource path "/datasets/{datasetId}/diff" at the end of the URL, set the unique ID of the dataset as {datasetId} element and the revision numbers of the revisions that are to be compared. To retrieve the difference between the most recent dataset and a revision of the dataset send a GET request to the specified URL of the API endpoint with the resource path "/datasets/{datasetId}/diff" at the end of the URL, set the unique ID of the dataset as {datasetId} element and leave one of the revision numbers empty and set the other revision number to the revision number of the dataset revision. This endpoint is disabled if the extended rights management feature is enabled. In this case a 405 status code is returned.
      summary: Get difference between two revisions
      operationId: getDatasetDiff
      tags:
      - Datasets
      responses:
        '200':
          $ref: '#/components/responses/RDF200'
        '400':
          description: Bad request
        '404':
          description: Catalogue or dataset id not found
  /datasets/{datasetId}/distributions:
    description: Deprecated!
    parameters:
    - $ref: '#/components/parameters/DatasetId'
    get:
      deprecated: true
      description: To get a list of distributions of a particular dataset make a GET request to the specified URL of the API endpoint with the resource path "/datasets/{datasetId}/distributions" at the end of the URL, set the unique ID of the dataset as {datasetId} element of the URL. If successful, the response will contain, by default, an array with the URLs of all distributions. To retrieve the other data of the distributions from the specified dataset select a different value for the parameter "valueType".
      summary: List dataset distributions
      operationId: listDatasetDistributions
      tags:
      - Datasets
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ValueType'
