- aid: eu-open-data-portal:eu-open-data-portal-sparql-api
  name: EU Open Data Portal SPARQL API
  description: The OpenLink Virtuoso SPARQL endpoint for data.europa.eu. Every harvested dataset is stored in its
    own named graph alongside DCAT-AP controlled vocabularies, NUTS codes and MQA quality measurements, and can
    be queried with SPARQL 1.1 returning HTML, XML, JSON, Turtle, CSV, TSV and other RDF serialisations. Public
    and unauthenticated; there is no OpenAPI for this surface because the contract is the SPARQL 1.1 protocol itself.
  humanURL: https://data.europa.eu/sparql
