  name: EU Open Data Portal MQA Metrics Cache API
  description: The Metadata Quality Assurance (MQA) metrics cache. Serves DCAT-AP quality scores for every catalogue,
    country, dataset and distribution across five dimensions — findability, accessibility, interoperability, reusability
