- aid: eu-open-data-portal:eu-open-data-portal-statistics-api
  name: EU Open Data Portal Statistics API
  description: >-
    The hub statistics service exposes portal-wide counts over time — datasets per category, per catalogue,
    per country, per format and per licence — behind a Swagger 2.0 contract served from a Flask/flask-apispec
    application. Read operations are public; the maintenance reset operation requires an X-API-KEY header.
  humanURL: https://data.europa.eu/api/hub/statistics/
  baseURL: https://data.europa.eu/api/hub/statistics
  tags:
