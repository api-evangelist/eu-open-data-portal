name: EU Open Data Portal
description: 'data.europa.eu is the official portal for European open data, operated by the Publications Office
  of the European Union. It federates roughly 1.9 million dataset records from EU institutions, the national open
  data portals of the member states and international organisations, and republishes them as DCAT-AP metadata. Six
  machine-readable APIs sit on top of that corpus: a hub-search metadata search service, a hub-repo DCAT-AP registry
  for publishers, a Virtuoso SPARQL endpoint, and the Metadata Quality Assurance metrics cache, metrics reporter
  and SHACL validation services. Read access is public and unauthenticated; publishing into a catalogue requires
  an EU Login account or a service account issued by the portal team.'
