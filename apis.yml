  name: EU Open Data Portal Registry API (hub-repo)
  description: 'The piveau hub-repo registry service: the DCAT-AP write surface of data.europa.eu. Manages catalogues,
    DCAT resources (datasets, data services, dataset series), distributions, drafts, vocabularies, quality metrics
    and persistent identifiers in the Virtuoso triplestore, in RDF/XML, Turtle, JSON-LD, N-Triples, N-Quads, TriG,
